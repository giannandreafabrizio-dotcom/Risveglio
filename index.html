<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Risveglio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800&family=Share+Tech+Mono&display=swap');

:root{
  --bg:#05070F; --panel:rgba(14,22,42,.72); --line:rgba(90,150,230,.28);
  --sys:#43B4FF; --glow:#6FE9FF; --violet:#B57BFF; --gold:#FFC663;
  --green:#4DFFA6; --red:#FF5468; --text:#DCE6FA; --dim:#93A2C4;
  --disp:'Rajdhani',sans-serif; --mono:'Share Tech Mono',monospace; --num:'Orbitron',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 80% at 50% -10%, #10203f 0%, var(--bg) 60%);
  color:var(--text); font-family:var(--disp);
  background-attachment:fixed;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));}
#app::before{content:"";position:fixed;inset:0;max-width:480px;margin:0 auto;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:34px 34px;opacity:.13;}

/* ---- system panel ---- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 0 18px -6px color-mix(in srgb,var(--pg,var(--sys)) 50%,transparent),
             inset 0 0 22px -12px color-mix(in srgb,var(--pg,var(--sys)) 40%,transparent);
  backdrop-filter:blur(4px);padding:14px;}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none;
  border-color:var(--pg,var(--sys));}
.panel::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}

.lbl{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sys)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between}
button{font-family:inherit;cursor:pointer;min-height:44px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{font-family:var(--mono)}
/* v2.8 — iPhone: sotto i 16px iOS ingrandisce da solo la pagina quando tocchi un campo */
input,select,textarea{font-size:16px!important}


/* ---- header ---- */
.hi{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1;color:var(--text)}

/* ---- level ---- */
.lvnum{font-family:var(--num);font-size:46px;font-weight:800;line-height:.9;color:var(--glow);
  text-shadow:0 0 20px rgba(67,180,255,.6)}
.rank{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1;color:var(--violet);
  text-shadow:0 0 16px rgba(181,123,255,.5)}
.bar{height:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0;background:linear-gradient(90deg,var(--sys),var(--glow));
  box-shadow:0 0 12px var(--glow);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---- quest card ---- */
.q{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;transition:opacity .3s}
.q.done{opacity:.55;cursor:default}
.q .ic{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid color-mix(in srgb,var(--cat) 45%,transparent);color:var(--cat);
  background:color-mix(in srgb,var(--cat) 8%,transparent);font-family:var(--mono);font-size:15px}
.q .t{flex:1;min-width:0}
.q .t b{font-family:var(--disp);font-size:15px;font-weight:600;color:var(--text);display:block}
.q.done .t b{text-decoration:line-through}
.q .t span{font-family:var(--mono);font-size:11px;color:var(--dim);display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .xp{font-family:var(--mono);font-size:11px;color:var(--cat);flex:0 0 auto}
.q .ck{width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center;
  border:1.5px solid color-mix(in srgb,var(--cat) 45%,transparent);color:var(--green);font-family:var(--mono)}
.q.done .ck{border-color:var(--green);background:rgba(77,255,166,.12)}

.stack{display:flex;flex-direction:column;gap:9px}
.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}.mb18{margin-bottom:18px}.mt8{margin-top:8px}

/* ---- bottom nav ---- */
#nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;height:74px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(6,10,22,.92);border-top:1px solid var(--line);display:flex;backdrop-filter:blur(8px);z-index:20}
#nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--dim);position:relative}
#nav button.on{color:var(--glow)}
#nav button.on::before{content:"";position:absolute;top:0;width:26px;height:2px;background:var(--glow);box-shadow:0 0 8px var(--glow)}
#nav .ni{font-size:19px;line-height:1}
#nav .nt{font-family:var(--mono);font-size:11px;letter-spacing:1px}

/* ---- toast ---- */
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:none;
  background:rgba(6,10,22,.95);padding:8px 16px;font-family:var(--mono);font-size:13px;
  letter-spacing:1px;white-space:nowrap;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- special quest modal ---- */
/* v2.8 — iPhone: i pannelli salgono dal basso, dove arriva il pollice */
#special{position:fixed;inset:0;z-index:60;display:none;place-items:end center;padding:0;
  background:rgba(3,5,12,.86);backdrop-filter:blur(3px)}
#special .box{width:100%;max-width:480px;background:#0C1428;border:1px solid var(--violet);border-bottom:none;
  box-shadow:0 -12px 44px -8px var(--violet), inset 0 0 40px -20px var(--violet);
  max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);
  animation:sq .32s cubic-bezier(.2,.9,.3,1.05)}
#special .box::before{content:"";display:block;width:38px;height:4px;border-radius:2px;
  background:rgba(220,230,250,.32);margin:9px auto 0}
@keyframes sq{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* v2.8 — riga che si scorre verso sinistra per eliminare */
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw>.del{position:absolute;top:0;right:0;bottom:0;width:104px;display:grid;place-items:center;
  background:linear-gradient(90deg,rgba(255,84,104,.14),rgba(255,84,104,.34));
  color:var(--red);font-family:var(--mono);font-size:11px;letter-spacing:1px}
.sw>.front{position:relative;background:#0b1322;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sw.open>.front{transform:translateX(-104px)}
#undo{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;display:none;
  background:rgba(6,10,22,.97);border:1px solid var(--red);box-shadow:0 0 22px -6px var(--red);
  padding:13px 16px;align-items:center;justify-content:space-between}
#undo span{font-family:var(--mono);font-size:12px;color:var(--text)}
#undo button{background:none;border:none;color:var(--glow);font-family:var(--mono);
  font-size:12px;letter-spacing:1px;padding:0 4px}

.btnfull{width:100%;padding:13px;font-family:var(--mono);font-size:13px;letter-spacing:2px;
  color:#05070F;font-weight:700;border:none;background:linear-gradient(90deg,var(--violet),var(--glow));
  box-shadow:0 0 20px -4px var(--violet)}
.demo{width:100%;padding:11px;font-family:var(--mono);font-size:12px;letter-spacing:1px;
  color:var(--red);border:1px solid rgba(255,84,104,.4);background:rgba(255,84,104,.05)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.5px;padding:3px 8px}

/* ---- v2.0 effetti "Sistema" ---- */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(111,233,255,.025) 0 1px,transparent 1px 3px)}
body::before{content:"";position:fixed;left:0;right:0;top:-160px;height:140px;pointer-events:none;z-index:5;
  background:linear-gradient(180deg,transparent,rgba(111,233,255,.055),transparent);
  animation:beam 10s linear infinite}
@keyframes beam{to{transform:translateY(130vh)}}
.bar{border-radius:0}
.bar>i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);
  transform:translateX(-100%);animation:sheen 2.8s ease-in-out infinite}
@keyframes sheen{55%,100%{transform:translateX(100%)}}
.lvltxt{font-family:var(--disp);font-size:32px;font-weight:800;letter-spacing:9px;color:var(--text);
  text-shadow:0 0 16px var(--sys);animation:lvpulse 1.1s ease-in-out infinite alternate}
@keyframes lvpulse{to{text-shadow:0 0 34px var(--glow),0 0 10px var(--glow)}}

   RISVEGLIO — app a file singolo (stile NutriGest)

/* Le chiavi Supabase stanno in config.js (file separato, non si tocca mai).
   Questo file NON va più modificato: sostituiscilo e basta. */
const CFG = window.RISVEGLIO_CONFIG || {};
const SUPABASE_URL      = CFG.url || "";
const SUPABASE_ANON_KEY = CFG.key || "";

/* ---------- logica livelli (pura) ---------- */
const XP_BASE=140, XP_STEP=6, MILESTONE=20, COMBO_BONUS=30, SKIP_PENALTY=70;
const WEEKLY_BONUS=40, WEEKLY_TARGET=3;
const xpNeeded = lvl => XP_BASE + lvl*XP_STEP;
function rankForLevel(l){ return l>=80?'S':l>=55?'A':l>=35?'B':l>=20?'C':l>=10?'D':'E'; }
function titleForLevel(l){
  return l>=80?'Sovrano delle Ombre' : l>=55?'Signore della Notte' : l>=35?"Cacciatore d'Elite"
       : l>=20?'Lupo Solitario' : l>=10?'Apprendista del Sistema' : 'Risvegliato';
}
function applyXp(s, delta){
  const start=s.level; let lvl=s.level, xp=s.currentXp+delta;
  while(xp>=xpNeeded(lvl)){ xp-=xpNeeded(lvl); lvl++; }
  while(xp<0 && lvl>1){ lvl--; xp+=xpNeeded(lvl); }
  if(xp<0) xp=0;
  const newMax=Math.max(s.maxLevelReached,lvl);
  const prevM=Math.floor(s.maxLevelReached/MILESTONE)*MILESTONE;
  const currM=Math.floor(newMax/MILESTONE)*MILESTONE;
  const newMilestone=(currM>prevM && currM>=MILESTONE)?currM:null;
  return {level:lvl,currentXp:xp,maxLevelReached:newMax,rank:rankForLevel(lvl),newMilestone};
}
/* v2.5 — soglia milestone superata confrontando il livello massimo prima/dopo */
function milestoneCrossed(prevMax,newMax){
  const p=Math.floor((prevMax||1)/MILESTONE)*MILESTONE;
  const c=Math.floor((newMax||1)/MILESTONE)*MILESTONE;
  return (c>p && c>=MILESTONE)?c:null;
}

  60:{ intro:'L’Ombra si desta e reclama una prova all’altezza del suo nome.', options:[

    {id:'b',diff:'media',    xp:240, metric:'trainings',    target:20,

    {id:'c',diff:'difficile',xp:350, metric:'books',        target:3,

  80:{ intro:'Il Trono del Sovrano attende. Nessuna soglia oltre questa: dimostra chi sei.', options:[

    {id:'b',diff:'media',    xp:340, metric:'active_days',  target:50,

    {id:'c',diff:'difficile',xp:500, metric:'quests_total', target:150,
      title:'L’Opera Magna', desc:'Completa 150 quest. L’ultima prova: forgia la tua leggenda, quest dopo quest.'} ]}
};
const METRIC_LABEL={quests_total:'quest',perfect_days:'giornate perfette',trainings:'allenamenti',books:'libri',active_days:'giornate attive'};

/* ---------- stato + client ---------- */
let sb=null, profile=null, quests=[], doneToday=new Set(), tab='home';
let plans=[], exercises=[], sessions={}, wLoaded=false;
let wView='list', curPlan=null, openEx=null, histEx=null, extraSets={}, draft={};

let overrides={}, events={}, calMonth=null, cLoaded=false, ferieCount=0;

let allQuests=[], manageLoaded=false, editingQuestId=null;

/* ============================================================
   TURNARIO — calcolo automatico (ciclo di 4 giorni, sezioni B1..B8)
   Ancoraggio verificato: 1 nov 2026 = B2, primo giorno (diurno).
   Fasi: 0 diurno 8-20 | 1 notte 20-8 | 2 smontante | 3 riposo
   Quando la sezione è B3 (la tua) → salto turno: fasi 0 e 1 libere.
   ============================================================ */
const MY_SECTION = 3;
const ANCHOR = Date.UTC(2026,10,1);   // 1 novembre 2026
const ANCHOR_B = 2;                   // quel giorno era B2
const DAYMS = 86400000;

function shiftFor(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const idx = Math.round((Date.UTC(y,m-1,d) - ANCHOR)/DAYMS);
  const phase = ((idx % 4) + 4) % 4;
  const cycle = Math.floor((idx - phase) / 4);
  const bNum  = ((ANCHOR_B - 1 + cycle) % 8 + 8) % 8 + 1;
  const salto = (bNum === MY_SECTION);
  let kind, label, icon;
  if(salto && phase < 2){ kind='salto'; label='B'+bNum; icon='⌂'; }
  else if(phase===0){ kind='diurno';     label='B'+bNum; icon='☀'; }
  else if(phase===1){ kind='notte';      label='B'+bNum; icon='☾'; }
  else if(phase===2){ kind='smontante';  label='';       icon=''; }
  else              { kind='riposo';     label='';       icon=''; }
  return {kind,label,icon,bNum,phase,salto};
}
const SHIFT_COLOR = {
  diurno:'#FFC663', notte:'#5B9BFF', salto:'#4DFFA6',
  smontante:'transparent', riposo:'transparent',
  ferie:'#B57BFF', richiamo:'#FF9F43'
};
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const localDate = tz => new Intl.DateTimeFormat('en-CA',{timeZone:tz||'Europe/Rome'}).format(new Date());
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESI_ABBR=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const fmtBookDate = d => { if(!d) return ''; const p=d.split('-'); return (MESI_ABBR[(+p[1])-1]||'')+' '+p[0]; };

function toast(txt,color){

  t.style.boxShadow='0 0 16px -2px '+color; t.textContent='[ '+txt+' ]';
  t.style.display='block'; clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.style.display='none',1400);
}

/* ---------- caricamento ---------- */
async function load(){
  const [{data:prof},{data:qs}] = await Promise.all([
    sb.from('profiles').select('*').eq('id',OWNER_ID).single(),
    sb.from('quests').select('*').eq('is_active',true).eq('frequency','daily').order('sort_order')

  const today=localDate(profile?.timezone);

  doneToday=new Set((logs||[]).map(l=>l.quest_id));

  await loadPhotos();
  await checkDailyPenalty(today);

  await checkWeeklyBonus(today);
  await loadSpecial();
  await measureMetrics();
  await loadStats();
  await checkSpecialQuests();
  render();
  if($('#special').style.display!=='grid') welcomeCheck();   // benvenuto (non copre altri avvisi)
}

/* ============================================================
   CARATTERISTICHE — caricamento e calcolo (v2.4)
   ============================================================ */
async function loadStats(){
  const {data,error}=await sb.from('stat_logs').select('log_date,activity,amount,variant').eq('user_id',OWNER_ID);
  if(error){ statsLoaded=false; statRows=[]; statTotals={}; regToday={}; return; }
  statRows=data||[];
  statTotals={};
  statRows.forEach(r=>{ statTotals[r.activity]=(statTotals[r.activity]||0)+Number(r.amount||0); });
  const today=localDate(profile&&profile.timezone);
  regToday={};
  statRows.filter(r=>r.log_date===today).forEach(r=>{ regToday[r.activity]=Number(r.amount||0); });
  statsLoaded=true;
}
function statPoints(){
  const p={}; STAT_DEF.forEach(s=>p[s.key]=0);
  ACT.forEach(a=>{
    if(a.auto) return;
    p[a.stat] += (Number(statTotals[a.key])||0) * a.pts;
  });
  p.str += (metricNow.trainings||0) * ACT_BY.palestra.pts;
  p.int += (metricNow.books||0)     * ACT_BY.libri.pts;
  return p;
}
function statValues(){
  const p=statPoints(), out={};
  STAT_DEF.forEach(s=>{
    const pts=p[s.key]||0;
    out[s.key]={ pts, val:STAT_BASE+Math.floor(pts/STAT_STEP),
                 prog:Math.min(100,(pts%STAT_STEP)/STAT_STEP*100),
                 miss:Math.max(0,STAT_STEP-(pts%STAT_STEP)) };
  });
  return out;
}
function gripIndex(){
  const today=localDate(profile&&profile.timezone);
  const days=new Set(statRows.filter(r=>r.activity==='trazioni'&&Number(r.amount)>0&&r.log_date!==today)
                             .map(r=>r.log_date));
  return days.size % GRIPS.length;
}
function gripToday(){
  const today=localDate(profile&&profile.timezone);
  const cur=statRows.find(r=>r.activity==='trazioni'&&r.log_date===today&&r.variant);
  return cur ? cur.variant : GRIPS[gripIndex()];
}
async function saveRegistro(){
  const today=localDate(profile.timezone);
  const before=statValues();
  const rows=[];
  ACT.filter(a=>!a.auto).forEach(a=>{
    const el=document.querySelector('input[data-act="'+a.key+'"]');
    if(!el) return;
    let v=parseFloat(String(el.value).replace(',','.'));
    if(isNaN(v)||v<0) v=0;
    const old=Number(regToday[a.key]||0);
    if(v!==old) rows.push({user_id:OWNER_ID,log_date:today,activity:a.key,amount:v,
      variant:a.grip?gripToday():null});
  });
  if(!rows.length){ toast('Nessuna modifica da salvare',getVar('--dim')); return; }
  const {error}=await sb.from('stat_logs').upsert(rows,{onConflict:'user_id,log_date,activity'});
  if(error){ toast('Errore salvataggio',getVar('--red')); return; }
  await loadStats();
  sfxQuest(); toast('REGISTRO SALVATO',getVar('--green'));
  const after=statValues();
  const ups=STAT_DEF.filter(s=>after[s.key].val>before[s.key].val);
  render();
  if(ups.length) statUpModal(ups,after);
}
function statUpModal(ups,vals){
  sfxCombo();
  const list=ups.map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)">
      <span style="font-family:var(--disp);font-size:16px;font-weight:700;color:${s.col}">${s.ic} ${s.name}</span>
      <span style="font-family:var(--num);font-size:20px;font-weight:800;color:${s.col}">${vals[s.key].val}</span></div>`).join('');
  const box=`<div class="box" style="border-color:var(--glow);box-shadow:0 0 40px -6px var(--glow),inset 0 0 40px -20px var(--sys)">
    <div style="padding:10px 14px;border-bottom:1px solid color-mix(in srgb,var(--sys) 35%,transparent);display:flex;justify-content:space-between;align-items:center">
      <span class="mono" style="font-size:11px;letter-spacing:2px;color:var(--sys)">⚠ NOTIFICA DEL SISTEMA</span>
      <button data-action="close-special" style="background:none;border:none;color:var(--dim);font-size:16px">✕</button></div>
    <div style="padding:22px">
      <div style="font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:3px;color:var(--glow);text-align:center;text-shadow:0 0 18px var(--sys);margin-bottom:14px">CARATTERISTICA AUMENTATA</div>
      ${list}
      <button class="btnfull mt8" data-action="close-special" style="margin-top:18px;background:linear-gradient(90deg,var(--sys),var(--glow))">CONTINUA L'ASCESA</button>
    </div></div>`;
  const m=$('#special'); m.innerHTML=box; m.style.display='grid';
}

async function measureMetrics(){

    sb.from('calendar_events').select('starts_at').eq('user_id',OWNER_ID),
    sb.from('workout_logs').select('log_date').eq('user_id',OWNER_ID),
    sb.from('xp_events').select('id').eq('user_id',OWNER_ID).eq('reason','combo'),
    sb.from('books').select('status').eq('user_id',OWNER_ID)
  ]);
  const qlogs=ql.data||[];
  const trainDays=new Set();
  (ce.data||[]).forEach(e=>{ const d=(e.starts_at||'').slice(0,10); if(d) trainDays.add(d); });
  (wl.data||[]).forEach(l=>{ if(l.log_date) trainDays.add(l.log_date); });
  metricNow={
    quests_total: qlogs.length,
    active_days: new Set(qlogs.map(l=>l.log_date)).size,
    perfect_days: (cb.data||[]).length,
    trainings: trainDays.size,
    books: (bk.data||[]).filter(b=>b.status==='finished').length
  };

}
async function checkSpecialQuests(){
  const active=Object.values(special).filter(s=>s.status==='active');
  if(!active.length) return;
  const met=await measureMetrics();
  for(const s of active){
    const cur=met[s.metric]??0;
    if(cur>=s.goal){
      await sb.from('special_quests').update({status:'completed',completed_at:new Date().toISOString()}).eq('id',s.id);
      const {updated}=await commitXp(s.xp_reward,'special',s.id,profile); profile=updated;

/* ---------- quest settimanale: 3 allenamenti (lun-dom) ---------- */
function weekBounds(todayStr){
  const [y,m,d]=todayStr.split('-').map(Number);
  const dow=(new Date(y,m-1,d).getDay()+6)%7;          // lunedì = 0
  const mon=new Date(y,m-1,d-dow), sun=new Date(y,m-1,d-dow+6);
  return {monday:iso(mon), sunday:iso(sun)};
}
async function loadWeeklyTraining(today){
  const {monday,sunday}=weekBounds(today);
  const days=new Set();
  // 1) giorni segnati nel calendario (allenamenti)
  const {data:cal}=await sb.from('calendar_events').select('starts_at').eq('user_id',OWNER_ID);
  (cal||[]).forEach(e=>{ const d=(e.starts_at||'').slice(0,10); if(d>=monday && d<=sunday) days.add(d); });
  // 2) giorni in cui ho salvato un peso nelle schede
  const {data:wl}=await sb.from('workout_logs').select('log_date').eq('user_id',OWNER_ID)
    .gte('log_date',monday).lte('log_date',sunday);
  (wl||[]).forEach(l=>{ if(l.log_date) days.add(l.log_date); });
  weekTrained=days.size;
}
async function checkWeeklyBonus(today){

    weeklyBonusJustGiven=true;
    toast(WEEKLY_TARGET+' ALLENAMENTI · +'+WEEKLY_BONUS+' XP',getVar('--gold'));
  }
}

/* ============================================================
   v2.5 — IL REGISTRO XP È L'UNICA FONTE DI VERITÀ
   Prima il totale veniva calcolato sulla copia che il telefono
   aveva in memoria: se quella copia era vecchia (app ripresa dal
   background, o aperta su due dispositivi) il salvataggio
   sovrascriveva il valore buono con uno vecchio e gli XP sparivano
   pur restando la quest registrata (successo il 5 agosto 2026).
   Da qui in poi livello, XP, grado e livello massimo si ricalcolano
   SEMPRE rigiocando tutti gli xp_events dal primo all'ultimo:
   all'avvio e dopo ogni variazione. Il conto si risistema da solo.
   ATTENZIONE: per correggere gli XP a mano non si tocca più
   profiles, si aggiunge una riga in xp_events (reason 'manual').
   ============================================================ */
async function stateFromLedger(){
  const {data,error}=await sb.from('xp_events').select('delta,created_at')
    .eq('user_id',OWNER_ID).order('created_at',{ascending:true});
  if(error||!data) return null;                       // rete assente: si tiene il valore salvato
  let s={level:1,currentXp:0,maxLevelReached:1};
  for(const e of data){
    const r=applyXp(s, Number(e.delta)||0);
    s={level:r.level,currentXp:r.currentXp,maxLevelReached:r.maxLevelReached};
  }
  return {level:s.level,current_xp:s.currentXp,max_level_reached:s.maxLevelReached,
          rank:rankForLevel(s.level)};
}
async function syncXpFromLedger(){
  if(!profile) return null;
  const led=await stateFromLedger();
  if(!led) return null;
  led.max_level_reached=Math.max(led.max_level_reached, profile.max_level_reached||1);
  const diverso = led.level!==profile.level || led.current_xp!==profile.current_xp
               || led.max_level_reached!==profile.max_level_reached || led.rank!==profile.rank;
  if(diverso) await sb.from('profiles').update(led).eq('id',OWNER_ID);
  profile={...profile,...led};
  return led;
}

/* ---------- scrittura XP: registro + copia nel profilo ---------- */
async function commitXp(delta,reason,refId,base){
  await sb.from('xp_events').insert({user_id:OWNER_ID,delta,reason,ref_id:refId||null});
  const prevMax=Math.max(base.max_level_reached||1,1);
  const led=await stateFromLedger();
  if(!led){                                           // fallback: comportamento pre-2.5
    const res=applyXp({level:base.level,currentXp:base.current_xp,maxLevelReached:base.max_level_reached},delta);
    const updated={...base,level:res.level,current_xp:res.currentXp,max_level_reached:res.maxLevelReached,rank:res.rank};
    await sb.from('profiles').update({level:updated.level,current_xp:updated.current_xp,
      max_level_reached:updated.max_level_reached,rank:updated.rank}).eq('id',OWNER_ID);
    return {updated,res};
  }
  led.max_level_reached=Math.max(led.max_level_reached,prevMax);
  await sb.from('profiles').update({level:led.level,current_xp:led.current_xp,
    max_level_reached:led.max_level_reached,rank:led.rank}).eq('id',OWNER_ID);
  const updated={...base,level:led.level,current_xp:led.current_xp,
    max_level_reached:led.max_level_reached,rank:led.rank};
  const res={level:led.level,currentXp:led.current_xp,maxLevelReached:led.max_level_reached,
    rank:led.rank,newMilestone:milestoneCrossed(prevMax,led.max_level_reached)};
  return {updated,res};
}
async function bumpStreak(base,today){
  const d=new Date(today); d.setDate(d.getDate()-1); const y=d.toISOString().slice(0,10);
  let next = base.last_active_date===today ? base.streak_count
           : base.last_active_date===y ? base.streak_count+1 : 1;
  await sb.from('profiles').update({streak_count:next,last_active_date:today}).eq('id',OWNER_ID);
  base.streak_count=next; base.last_active_date=today;
}

/* ---------- completa quest ---------- */
async function completeQuest(id){
  if(doneToday.has(id)) return;
  const q=quests.find(x=>x.id===id); if(!q) return;
  const today=localDate(profile.timezone);
  const prevLvl=profile.level;
  doneToday.add(id); sfxQuest(); render();                      // ottimistico
  const {error}=await sb.from('quest_logs').insert({user_id:OWNER_ID,quest_id:id,log_date:today,xp_awarded:q.xp_value});
  if(error){ doneToday.delete(id); toast('Errore, riprova',getVar('--red')); render(); return; }
  let {updated,res}=await commitXp(q.xp_value,'quest',id,profile); profile=updated;
  toast('+'+q.xp_value+' XP · '+q.category, CAT[q.category].c);
  if(quests.every(x=>doneToday.has(x.id))){
    const combo=await commitXp(COMBO_BONUS,'combo',null,profile); profile=combo.updated;
    setTimeout(()=>{ toast('COMBO GIORNALIERA +'+COMBO_BONUS+' XP',getVar('--gold')); sfxCombo(); },750);
    await bumpStreak(profile,today);
    if(combo.res.newMilestone) res={...res,newMilestone:combo.res.newMilestone};
  }
  await checkSpecialQuests();
  const leveled=profile.level>prevLvl;
  if(res.newMilestone) offerSpecial(res.newMilestone);
  else if(leveled) levelUpModal(profile.level);
  render();
}

let actx=null;
function ac(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq,start,dur,type,vol){
  const c=ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+start;
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol||.16,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}

async function saveQuestForm(){
  const ti=$('#special input[data-q="title"]'), si=$('#special input[data-q="subtitle"]');
  const ci=$('#special select[data-q="category"]'), xi=$('#special input[data-q="xp"]');
  const title=(ti?ti.value:'').trim(), subtitle=(si?si.value:'').trim();
  const category=ci?ci.value:'sport'; let xp=parseInt(xi?xi.value:'20',10);
  if(!title){ toast('Scrivi il nome della quest',getVar('--red')); return; }
  if(isNaN(xp)) xp=20; xp=Math.max(10,Math.min(50,xp));
  if(editingQuestId){
    const {error}=await sb.from('quests').update({title,subtitle:subtitle||null,category,xp_value:xp}).eq('id',editingQuestId);
    if(error){ toast('Errore salvataggio',getVar('--red')); return; }
    toast('Quest aggiornata',getVar('--green'));
  }else{
    const maxOrder=allQuests.reduce((m,q)=>Math.max(m,q.sort_order||0),0);
    const {error}=await sb.from('quests').insert({title,subtitle:subtitle||null,category,xp_value:xp,
      frequency:'daily',is_active:true,sort_order:maxOrder+1});
    if(error){ toast('Errore salvataggio',getVar('--red')); return; }
    toast('Quest aggiunta',getVar('--green'));
  }
  $('#special').style.display='none';
  await loadAllQuests();
  const {data:qs}=await sb.from('quests').select('*').eq('is_active',true).eq('frequency','daily').order('sort_order');
  quests=qs||[];
  render();
}
async function toggleQuestActive(id){
  const q=allQuests.find(x=>x.id===id); if(!q) return;
  const {error}=await sb.from('quests').update({is_active:!q.is_active}).eq('id',id);
  if(error){ toast('Errore, riprova',getVar('--red')); return; }
  await loadAllQuests();
  const {data:qs}=await sb.from('quests').select('*').eq('is_active',true).eq('frequency','daily').order('sort_order');
  quests=qs||[];
  toast(q.is_active?'Quest disattivata':'Quest riattivata',getVar('--dim'));
  render();
}
async function moveQuest(id,dir){
  const idx=allQuests.findIndex(x=>x.id===id); if(idx<0) return;
  const swapIdx=idx+dir; if(swapIdx<0||swapIdx>=allQuests.length) return;
  const a=allQuests[idx], b=allQuests[swapIdx];
  const aOrder=a.sort_order??idx, bOrder=b.sort_order??swapIdx;
  await Promise.all([
    sb.from('quests').update({sort_order:bOrder}).eq('id',a.id),
    sb.from('quests').update({sort_order:aOrder}).eq('id',b.id)
  ]);
  await loadAllQuests();
  const {data:qs}=await sb.from('quests').select('*').eq('is_active',true).eq('frequency','daily').order('sort_order');
  quests=qs||[];
  render();
}

  if(tab==='home') s.innerHTML=viewHome();
  else if(tab==='workout') s.innerHTML=viewWorkout();
  else if(tab==='cal') s.innerHTML=viewCalendar();
  else if(tab==='lib') s.innerHTML=viewLibrary();
  else if(tab==='me') s.innerHTML=viewProfile();
  else if(tab==='manage') s.innerHTML=viewManageQuests();
  else if(tab==='status') s.innerHTML=viewStatus();
  else if(tab==='reg') s.innerHTML=viewRegistro();

/* ============================================================
   SCHEDE ALLENAMENTO (riscritte in v2.7)
   - le schede e gli esercizi si creano e si modificano dall'app
   - i carichi si registrano SERIE PER SERIE (un peso per ogni serie)
   - le ripetizioni sono l'obiettivo scritto nella scheda, non si registrano
   - un esercizio aperto alla volta: gli altri restano righe chiuse
   Tabelle: workout_plans, workout_exercises, workout_logs
   Colonne aggiunte in v2.7: workout_logs.set_no, workout_exercises.sets_n / reps_txt
   ============================================================ */
const fmtKg = v => String(Math.round(Number(v)*100)/100).replace('.',',');
const dmy   = d => { const p=String(d).split('-'); return (+p[2])+' '+(MESI_ABBR[(+p[1])-1]||'').toLowerCase(); };

async function loadWorkout(){
  const [{data:pl},{data:ex},{data:lg}] = await Promise.all([
    sb.from('workout_plans').select('*').eq('user_id',OWNER_ID).order('sort_order'),
    sb.from('workout_exercises').select('*').eq('user_id',OWNER_ID).order('sort_order'),
    sb.from('workout_logs').select('exercise_id,log_date,set_no,weight').eq('user_id',OWNER_ID)
  ]);
  plans=pl||[]; exercises=ex||[];
  sessions={};
  (lg||[]).forEach(l=>{
    const byDate=(sessions[l.exercise_id]=sessions[l.exercise_id]||{});
    (byDate[l.log_date]=byDate[l.log_date]||[]).push({n:Number(l.set_no)||1,w:Number(l.weight)||0});
  });
  Object.keys(sessions).forEach(id=>{
    const byDate=sessions[id];
    sessions[id]=Object.keys(byDate).sort().reverse()
      .map(d=>({date:d,sets:byDate[d].sort((a,b)=>a.n-b.n)}));
  });
  wLoaded=true; render();
}
const exSessions = id => sessions[id]||[];
const exToday    = (id,today) => exSessions(id).find(s=>s.date===today)||null;
const exPrevious = (id,today) => exSessions(id).find(s=>s.date!==today)||null;
const setsList   = s => s ? s.sets.map(x=>fmtKg(x.w)).join(' · ') : '';
const exVolume   = s => s ? s.sets.reduce((a,x)=>a+x.w,0) : 0;
const exBest     = id => exSessions(id).reduce((m,s)=>s.sets.reduce((mm,x)=>Math.max(mm,x.w),m),0);
const setRows    = e => Math.max(1,(Number(e.sets_n)||3)+(extraSets[e.id]||0));
const repsOf     = e => e.reps_txt || e.scheme || '';

/* ---------- salvataggio dei carichi di oggi ---------- */
async function saveExerciseLogs(exId){
  const e=exercises.find(x=>x.id===exId); if(!e) return;
  const today=localDate(profile.timezone);
  const n=setRows(e), rows=[];
  for(let i=1;i<=n;i++){
    const el=document.querySelector('input[data-set="'+exId+'|'+i+'"]');
    if(!el) continue;
    const v=parseFloat(String(el.value).replace(',','.'));
    if(isNaN(v)||v<=0) continue;
    rows.push({user_id:OWNER_ID,exercise_id:exId,log_date:today,set_no:i,weight:v});
  }
  if(!rows.length){ toast('Scrivi almeno un peso',getVar('--red')); return; }
  await sb.from('workout_logs').delete().eq('user_id',OWNER_ID).eq('exercise_id',exId).eq('log_date',today);
  const {error}=await sb.from('workout_logs').insert(rows);
  if(error){ toast('Errore salvataggio',getVar('--red')); return; }
  Object.keys(draft).forEach(k=>{ if(k.indexOf(exId+'|')===0) delete draft[k]; });
  extraSets[exId]=0; openEx=null;
  await loadWorkout();
  await refreshWeekly();
  sfxQuest();
  if(!weeklyBonusJustGiven) toast('ESERCIZIO SALVATO',getVar('--green'));
  render();
}

async function saveExForm(){
  const ni=$('#special input[data-ex="name"]'), si=$('#special input[data-ex="sets"]'), ri=$('#special input[data-ex="reps"]');
  const name=(ni?ni.value:'').trim(), reps=(ri?ri.value:'').trim();
  let sets=parseInt(si?si.value:'3',10);
  if(!name){ toast('Scrivi il nome dell\'esercizio',getVar('--red')); return; }
  if(isNaN(sets)) sets=3;
  sets=Math.max(1,Math.min(12,sets));
  const scheme=sets+' × '+(reps||'—');
  if(editingExId){
    const {error}=await sb.from('workout_exercises')
      .update({name,sets_n:sets,reps_txt:reps||null,scheme}).eq('id',editingExId);
    if(error){ toast('Errore salvataggio',getVar('--red')); return; }
    toast('Esercizio aggiornato',getVar('--green'));
  }else{
    const inPlan=exercises.filter(x=>x.plan_id===curPlan);
    const maxOrder=inPlan.reduce((m,x)=>Math.max(m,x.sort_order||0),0);
    const {error}=await sb.from('workout_exercises').insert({user_id:OWNER_ID,plan_id:curPlan,
      name,sets_n:sets,reps_txt:reps||null,scheme,sort_order:maxOrder+1});
    if(error){ toast('Errore salvataggio',getVar('--red')); return; }
    toast('Esercizio aggiunto',getVar('--green'));
  }
  $('#special').style.display='none';
  await loadWorkout();
}
async function delExercise(id){ swipeDelete('ex',id); }
async function moveExercise(id,dir){
  const list=exercises.filter(e=>e.plan_id===curPlan);
  const idx=list.findIndex(e=>e.id===id); if(idx<0) return;
  const swap=idx+dir; if(swap<0||swap>=list.length) return;
  const a=list[idx], b=list[swap];
  const ao=a.sort_order??idx, bo=b.sort_order??swap;
  await Promise.all([
    sb.from('workout_exercises').update({sort_order:bo}).eq('id',a.id),
    sb.from('workout_exercises').update({sort_order:ao}).eq('id',b.id)
  ]);
  await loadWorkout();
}

function viewExHistory(){
  const e=exercises.find(x=>x.id===histEx);
  if(!e){ wView='plan'; return viewPlanUse(); }
  const ss=exSessions(e.id), today=localDate(profile.timezone);
  const head='<div class="row mb14"><div><div class="lbl dim">Storico</div><div class="hi">'+esc(e.name)+'</div></div>'
    +'<button class="mono" data-action="wback2" style="padding:8px 12px;color:var(--sys);border:1px solid var(--line);background:transparent;font-size:11px">‹ Indietro</button></div>';
  if(!ss.length) return head+'<div class="panel" style="--pg:var(--dim)"><div class="mono" style="font-size:11.5px;color:var(--dim);line-height:1.7">'
    +'Nessun carico registrato per questo esercizio.</div></div>';
  const cards=ss.slice(0,12).map((s,i)=>{
    const prev=ss[i+1];
    const v=exVolume(s), diff=prev?v-exVolume(prev):null;
    const badge = diff===null ? ''
      : diff>0 ? '<span class="mono" style="font-size:11px;color:var(--green)">▲ +'+fmtKg(diff)+' kg</span>'
      : diff<0 ? '<span class="mono" style="font-size:11px;color:var(--gold)">▼ '+fmtKg(diff)+' kg</span>'
      : '<span class="mono" style="font-size:11px;color:var(--dim)">— uguale</span>';
    const c = s.date===today ? 'var(--green)' : (i===0?'var(--sys)':'var(--dim)');
    return '<div class="panel" style="--pg:'+c+';padding:11px">'
      +'<div class="row"><span class="mono" style="font-size:11px;color:'+c+'">'
      +(s.date===today?'OGGI · ':'')+dmy(s.date).toUpperCase()+'</span>'+badge+'</div>'
      +'<div class="mono" style="font-size:12.5px;margin-top:5px;color:var(--text)">'+s.sets.map(x=>fmtKg(x.w)).join(' · ')+' kg</div>'
      +'<div class="mono" style="font-size:11px;color:var(--dim);margin-top:3px">volume: '+fmtKg(v)+' kg · '+s.sets.length+' serie</div></div>';
  }).join('');
  return head
    +'<div class="panel mb14" style="--pg:var(--gold);text-align:center">'
    +'<div class="mono" style="font-size:11px;letter-spacing:1px;color:var(--dim)">CARICO PIÙ ALTO REGISTRATO</div>'
    +'<div style="font-family:var(--num);font-size:26px;font-weight:800;color:var(--gold);margin-top:4px">'+fmtKg(exBest(e.id))+' kg</div>'
    +'<div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">'+ss.length+' allenamenti registrati</div></div>'
    +'<div class="stack">'+cards+'</div>';
}

/* ---- CALENDARIO (turni calcolati + eccezioni dal database) ---- */
async function loadCal(){
  const [{data},{data:evs}]=await Promise.all([
    sb.from('shift_overrides').select('*').eq('user_id',OWNER_ID),
    sb.from('calendar_events').select('*').eq('user_id',OWNER_ID)
  ]);
  overrides={}; (data||[]).forEach(o=>overrides[o.day]=o.kind);
  events={}; (evs||[]).forEach(e=>{ const d=e.starts_at.slice(0,10); (events[d]=events[d]||[]).push(e); });
  ferieCount=(data||[]).filter(o=>o.kind==='ferie'&&o.day.startsWith(String(new Date().getFullYear()))).length;
  cLoaded=true; render();
}
async function toggleTraining(day){
  const ex=(events[day]||[])[0];
  if(ex){
    await sb.from('calendar_events').delete().eq('id',ex.id);
    delete events[day]; toast('Allenamento rimosso',getVar('--dim'));
  }else{
    const {data}=await sb.from('calendar_events').insert({user_id:OWNER_ID,title:'Allenamento',
      type:'allenamento',starts_at:day+'T08:00:00+02:00',all_day:true}).select();
    events[day]=data||[{}]; toast('Allenamento aggiunto',getVar('--sys'));
  }
  await refreshWeekly();
  $('#special').style.display='none'; render();
}
async function setOverride(day,kind){
  if(kind==='auto'){
    await sb.from('shift_overrides').delete().eq('user_id',OWNER_ID).eq('day',day);
    delete overrides[day];
  }else{
    await sb.from('shift_overrides').upsert({user_id:OWNER_ID,day,kind},{onConflict:'user_id,day'});
    overrides[day]=kind;
  }
  ferieCount=Object.entries(overrides).filter(([d,k])=>k==='ferie'&&d.startsWith(String(new Date().getFullYear()))).length;
  $('#special').style.display='none';
  toast(kind==='auto'?'Ripristinato':kind.toUpperCase(),getVar('--glow'));
  render();
}

function viewCalendar(){
  if(!cLoaded){ loadCal(); return `<div class="lbl dim">Pianificazione</div><div class="hi mb14">Calendario</div>
    <div class="mono" style="font-size:12px;color:var(--dim)">caricamento…</div>`; }
  const now=new Date();
  if(!calMonth) calMonth={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=calMonth;
  const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const first=new Date(y,m,1), start=((first.getDay()+6)%7); // lunedì = 0
  const ndays=new Date(y,m+1,0).getDate();
  const todayStr=iso(now);

  let cells='';
  for(let i=0;i<start;i++) cells+='<div></div>';
  for(let d=1;d<=ndays;d++){
    const ds=iso(new Date(y,m,d));
    const s=shiftFor(ds), ov=overrides[ds];
    const kind = ov ? (ov==='libero'?'riposo':ov) : s.kind;
    const col=SHIFT_COLOR[kind]||'transparent';
    const filled = col!=='transparent';
    const lab = ov==='ferie'?'FER' : ov==='richiamo'?'EXT' : ov==='libero'?'' : s.label;
    const ic  = ov==='ferie'?'✈' : ov==='richiamo'?'☀' : ov==='libero'?'' : s.icon;
    const isToday = ds===todayStr;
    cells+=`<div data-action="day" data-day="${ds}" style="aspect-ratio:1;padding:4px;cursor:pointer;position:relative;
      border:1px solid ${isToday?'var(--glow)':'var(--line)'};
      background:${filled?`color-mix(in srgb,${col} 20%,transparent)`:'rgba(255,255,255,.02)'};
      box-shadow:${isToday?'0 0 10px -3px var(--glow)':'none'};display:flex;flex-direction:column;justify-content:space-between">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <span style="font-family:var(--disp);font-size:13px;font-weight:600;color:${filled?col:'var(--dim)'}">${d}</span>
        <span style="font-size:11px;color:${filled?col:'transparent'}">${ic}</span></div>
      <span class="mono" style="font-size:11px;letter-spacing:.5px;color:${filled?col:'transparent'}">${lab}</span>
      ${(events[ds]||[]).length?'<i style="position:absolute;bottom:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--glow);box-shadow:0 0 6px var(--glow)"></i>':''}</div>`;
  }

  const leg=[['diurno','8–20'],['notte','20–8'],['salto','salto turno'],['ferie','ferie'],['richiamo','richiamo']]
    .map(([k,t])=>`<span class="mono" style="font-size:11px;color:${SHIFT_COLOR[k]};display:inline-flex;align-items:center;gap:4px">
      <i style="width:8px;height:8px;background:${SHIFT_COLOR[k]};display:inline-block"></i>${t}</span>`).join('');

  return `<div class="row mb14">
      <div><div class="lbl dim">Turnario · Sezione B${MY_SECTION}</div><div class="hi">${MESI[m]} ${y}</div></div>
      <div style="display:flex;gap:6px">
        <button class="mono" data-action="mprev" style="padding:6px 10px;color:var(--sys);border:1px solid var(--line);background:transparent">‹</button>
        <button class="mono" data-action="mnext" style="padding:6px 10px;color:var(--sys);border:1px solid var(--line);background:transparent">›</button>
      </div></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px">
      ${['L','M','M','G','V','S','D'].map(g=>`<div class="mono" style="text-align:center;font-size:11px;color:var(--dim)">${g}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${cells}</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">${leg}</div>
    <div class="panel mt8" style="--pg:var(--violet);margin-top:14px;text-align:center">
      <div class="mono" style="font-size:11px;letter-spacing:1px;color:var(--violet)">FERIE ${new Date().getFullYear()}</div>
      <div style="font-family:var(--num);font-size:22px;color:var(--glow);margin-top:4px">${ferieCount} / 27</div>
      <div class="mono" style="font-size:11px;color:var(--dim);margin-top:4px">${27-ferieCount} giorni disponibili</div></div>
    <div class="mono" style="font-size:11px;color:var(--dim);margin-top:10px;text-align:center">tocca un giorno per ferie o richiamo</div>`;
}

async function saveBook(){
  const ti=$('#special input[data-book="title"]'), ai=$('#special input[data-book="author"]');
  const t=(ti?ti.value:'').trim(), a=(ai?ai.value:'').trim();
  if(!t){ toast('Scrivi almeno il titolo',getVar('--red')); return; }
  const {error}=await sb.from('books').insert({user_id:OWNER_ID,title:t,author:a||null,status:'reading'});
  if(error){ toast('Errore salvataggio',getVar('--red')); return; }
  $('#special').style.display='none';
  await loadBooks(); toast('Libro aggiunto',getVar('--sys')); render();
}
async function finishBook(id){
  const today=localDate(profile.timezone);
  const {error}=await sb.from('books').update({status:'finished',finished_date:today}).eq('id',id);
  if(error){ toast('Errore, riprova',getVar('--red')); return; }
  await loadBooks(); await measureMetrics(); await checkSpecialQuests();
  toast('Libro completato!',getVar('--green')); render();
}

/* ---------- sezione Quest Speciali nel Profilo ---------- */
function specialSection(){
  const ths=[20,40,60,80].filter(t=>profile.max_level_reached>=t && CHALLENGES[t]);
  if(!ths.length) return '';
  const cards=ths.map(t=>{
    const s=special[t];
    if(!s){
      return `<div class="panel" style="--pg:var(--violet);padding:12px;margin-bottom:9px">
        <div class="row"><div style="flex:1"><div class="mono" style="font-size:11px;color:var(--violet)">SOGLIA ${t} · DISPONIBILE</div>
          <b style="font-family:var(--disp);font-size:15px">Quest speciale da affrontare</b></div>
          <button class="mono" data-action="choose-special" data-th="${t}" style="padding:9px 13px;font-size:11px;letter-spacing:1px;color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 45%,transparent);background:color-mix(in srgb,var(--violet) 7%,transparent)">SCEGLI</button></div></div>`;
    }
    if(s.status==='completed'){
      return `<div class="panel" style="--pg:var(--green);padding:12px;margin-bottom:9px;opacity:.9">
        <div class="mono" style="font-size:11px;color:var(--green)">SOGLIA ${t} · COMPLETATA ✓</div>
        <b style="font-family:var(--disp);font-size:15px">${esc(s.title)}</b>
        <div class="mono" style="font-size:11px;color:var(--dim);margin-top:2px">Ricompensa incassata: +${s.xp_reward} XP</div></div>`;
    }
    const cur=(metricNow&&metricNow[s.metric]!==undefined)?metricNow[s.metric]:s.baseline;
    const tot=Math.max(1,s.goal-s.baseline);
    const prog=Math.max(0,Math.min(tot, cur-s.baseline));
    const pct=Math.min(100,prog/tot*100);
    return `<div class="panel" style="--pg:var(--gold);padding:12px;margin-bottom:9px">
      <div class="mono" style="font-size:11px;color:var(--gold)">SOGLIA ${t} · IN CORSO</div>
      <b style="font-family:var(--disp);font-size:15px">${esc(s.title)}</b>
      <div class="mono" style="font-size:11px;color:var(--dim);margin:2px 0 8px;line-height:1.4">${esc(s.description)}</div>
      <div class="row mono" style="font-size:11px;color:var(--dim);margin-bottom:5px"><span>${prog}/${tot} ${METRIC_LABEL[s.metric]||''}</span><span style="color:var(--gold)">+${s.xp_reward} XP</span></div>
      <div class="bar"><i style="width:${pct}%;background:linear-gradient(90deg,var(--gold),var(--glow));box-shadow:0 0 12px var(--gold)"></i></div></div>`;
  }).join('');
  return `<div class="lbl" style="color:var(--violet);margin-bottom:8px">Quest Speciali</div>${cards}
    <div style="height:14px"></div>`;
}

/* ============================================================
   v2.8 — REVISIONE iPHONE
   L'app si usa al 99% dal telefono, in palestra, con una mano.
   Qui dentro: scorrimento laterale per eliminare (con ANNULLA al posto
   della finestra "sei sicuro?"), conferme fatte con un pannello dell'app

/* ---------- eliminazione con scorrimento + ANNULLA ----------
   L'elemento non viene cancellato subito: sparisce dalla schermata e la
   cancellazione vera parte dopo 5 secondi, o subito se cambi pagina.
   Così ANNULLA non deve "resuscitare" niente dal database.            */
let pendingDel=null, undoTimer=null, justSwiped=false;
const isPending = (kind,id) => !!(pendingDel && pendingDel.kind===kind && pendingDel.id===id);

function swipeRow(kind,id,inner){
  return '<div class="sw" data-sw="'+kind+'|'+id+'">'
       + '<div class="del" data-action="swdel" data-sw="'+kind+'|'+id+'">🗑 ELIMINA</div>'
       + '<div class="front">'+inner+'</div></div>';
}
function nomeDi(kind,id){
  if(kind==='ex')   { const e=exercises.find(x=>x.id===id); return e?e.name:'Esercizio'; }
  if(kind==='plan') { const p=plans.find(x=>x.id===id);     return p?p.name:'Scheda'; }
  if(kind==='book') { const b=books.find(x=>x.id===id);     return b?b.title:'Libro'; }
  return 'Elemento';
}
function swipeDelete(kind,id){
  flushDelete();                       // se ce n'era un altro in attesa, si esegue adesso
  pendingDel={kind,id};
  const u=document.getElementById('undo');
  u.querySelector('span').textContent='“'+nomeDi(kind,id)+'” eliminato';
  u.style.display='flex';
  clearTimeout(undoTimer);
  undoTimer=setTimeout(()=>{ flushDelete(); },5000);
  sfxBad();
  render();
}
function annullaDelete(){
  clearTimeout(undoTimer); pendingDel=null;
  document.getElementById('undo').style.display='none';
  toast('ANNULLATO',getVar('--glow'));
  render();
}
async function flushDelete(){
  const p=pendingDel; if(!p) return;
  pendingDel=null; clearTimeout(undoTimer);
  document.getElementById('undo').style.display='none';
  try{
    if(p.kind==='ex'){
      await sb.from('workout_logs').delete().eq('user_id',OWNER_ID).eq('exercise_id',p.id);
      await sb.from('workout_exercises').delete().eq('id',p.id);
      if(openEx===p.id) openEx=null;
      await loadWorkout();
    }else if(p.kind==='plan'){
      const ids=exercises.filter(e=>e.plan_id===p.id).map(e=>e.id);
      if(ids.length){
        await sb.from('workout_logs').delete().eq('user_id',OWNER_ID).in('exercise_id',ids);
        await sb.from('workout_exercises').delete().in('id',ids);
      }
      await sb.from('workout_plans').delete().eq('id',p.id);
      if(curPlan===p.id){ curPlan=null; openEx=null; wView='list'; }
      await loadWorkout();
    }else if(p.kind==='book'){
      await sb.from('books').delete().eq('id',p.id);
      await loadBooks();
      await measureMetrics();
    }
  }catch(e){ toast('Errore, riprova',getVar('--red')); }
  render();
}

/* ---------- il gesto vero e proprio ---------- */
(function initSwipe(){
  const sc=document.getElementById('screen');
  let el=null, front=null, x0=0, base=0, dx=0;
  sc.addEventListener('pointerdown',e=>{
    const t=e.target.closest('.sw');
    if(!t || e.target.closest('.del')) return;
    el=t; front=t.querySelector('.front');
    base=t.classList.contains('open')?-104:0;
    x0=e.clientX; dx=base;
    front.style.transition='none';
  });
  sc.addEventListener('pointermove',e=>{
    if(!el) return;
    dx=Math.max(-150,Math.min(0,base+(e.clientX-x0)));
    front.style.transform='translateX('+dx+'px)';
  });
  const fine=()=>{
    if(!el) return;
    front.style.transition=''; front.style.transform='';
    const aperto = dx<-52;
    el.classList.toggle('open',aperto);
    justSwiped = Math.abs(dx-base)>6;          // evita che il tocco apra anche la riga
    setTimeout(()=>{ justSwiped=false; },260);
    el=null;
  };
  sc.addEventListener('pointerup',fine);
  sc.addEventListener('pointercancel',fine);
  sc.addEventListener('pointerleave',fine);
})();

/* ---------- schermo sempre acceso mentre sei dentro una scheda ---------- */
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){
      wakeLock=await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; });
    }else if(!on && wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ /* non supportato o negato: pazienza */ }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') flushDelete();
  else if(tab==='workout' && wView==='plan') keepAwake(true);
});
window.addEventListener('pagehide',()=>{ flushDelete(); });

  else if(a==='wopen'){ curPlan=el.dataset.id; openEx=null; wView='plan'; render(); }
  else if(a==='wback'){ wView='list'; openEx=null; render(); }
  else if(a==='wback2'){ wView='plan'; render(); }
  else if(a==='wex'){ openEx=(openEx===el.dataset.id?null:el.dataset.id); render(); }
  else if(a==='wsave') saveExerciseLogs(el.dataset.id);
  else if(a==='waddset'){ extraSets[el.dataset.id]=(extraSets[el.dataset.id]||0)+1; render(); }
  else if(a==='whist'){ histEx=el.dataset.id; wView='hist'; render(); }
  else if(a==='wedit'){ wView='edit'; render(); }
  else if(a==='wdone'){ wView='plan'; render(); }
  else if(a==='wnewplan') planForm(null);
  else if(a==='wplanedit') planForm(curPlan);
  else if(a==='wplandel') delPlan();
  else if(a==='wnewex') exForm(null);
  else if(a==='wexedit') exForm(el.dataset.id);
  else if(a==='wup') moveExercise(el.dataset.id,-1);
  else if(a==='wdown') moveExercise(el.dataset.id,1);
  else if(a==='day') dayMenu(el.dataset.day);
  else if(a==='mprev'){ calMonth.m--; if(calMonth.m<0){calMonth.m=11;calMonth.y--;} render(); }
  else if(a==='mnext'){ calMonth.m++; if(calMonth.m>11){calMonth.m=0;calMonth.y++;} render(); }
  else if(a==='addbook') bookForm();
  else if(a==='finish-book') finishBook(el.dataset.id);
  else if(a==='del-book') delBook(el.dataset.id);
  else if(a==='addphoto') pickPhoto(+el.dataset.level);
  else if(a==='viewphoto') photoModal(+el.dataset.level);
  else if(a==='gotomanage'){ tab='manage'; render(); }
  else if(a==='backtome'){ tab='me'; render(); }
  else if(a==='qnew') openQuestForm(null);
  else if(a==='qedit') openQuestForm(el.dataset.id);
  else if(a==='qtoggle') toggleQuestActive(el.dataset.id);
  else if(a==='qup') moveQuest(el.dataset.id,-1);
  else if(a==='qdown') moveQuest(el.dataset.id,1);
  else if(a==='choose-special') specialChoiceModal(+el.dataset.th);
  else if(a==='status'){ tab='status'; render(); }
  else if(a==='backhome'){ tab='home'; render(); }
  else if(a==='gostatus'){ tab='status'; render(); }
  else if(a==='goreg'){ tab='reg'; render(); }
  else if(a==='savereg') saveRegistro();
  else if(a==='stp'){
    const inp=document.querySelector('input[data-act="'+el.dataset.act+'"]');

      let v=parseFloat(String(inp.value).replace(',','.')); if(isNaN(v)) v=0;

      inp.value=Math.round(v*100)/100;

/* ---------- schermata di risveglio del Sistema (v2.4) ---------- */
let bootDone=false;
function bootHide(){
  if(bootDone) return; bootDone=true;
  const b=document.getElementById('boot'); if(!b) return;
  b.classList.add('off');
  setTimeout(()=>{ b.style.display='none'; },700);
}
(function initBoot(){
  const b=document.getElementById('boot'); if(!b) return;
  b.addEventListener('click',bootHide);
  setTimeout(bootHide,3600);
})();

/* ============================================================
   v2.6 — AGGIORNAMENTO AUTOMATICO
   Safari tiene in memoria la copia scaricata dell'app: senza questo
   controllo il telefono continuerebbe a mostrare la versione vecchia
   finché non si toglie e rimette l'icona dalla schermata Home.
   Come funziona: nella cartella c'è il file `versione.txt` con dentro
   solo il numero dell'ultima versione pubblicata (lo aggiorna da solo
   `pubblica.bat`). All'avvio l'app lo rilegge saltando la cache e,
   se non coincide con APP_VERSION, si ricarica aggiungendo `?v=numero`
   all'indirizzo: essendo un indirizzo nuovo, Safari è costretto a
   riscaricare il file aggiornato.
   La protezione con sessionStorage evita che, se qualcosa non torna,
   l'app entri in un ciclo infinito di ricariche.
   In locale (doppio clic, file://) la lettura fallisce e viene ignorata.
   ============================================================ */
async function checkUpdate(){
  try{
    const r=await fetch('versione.txt?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const v=(await r.text()).trim();
    if(!v || v.length>10 || v===APP_VERSION) return;
    let tried=null; try{ tried=sessionStorage.getItem('rv_upd'); }catch(e){}
    if(tried===v) return;                       // già tentato: non insistere
    try{ sessionStorage.setItem('rv_upd',v); }catch(e){}
    const b=document.querySelector('#boot .bt');
    if(b && !bootDone) b.textContent='AGGIORNAMENTO IN CORSO';
    else toast('AGGIORNAMENTO ALLA '+v,getVar('--glow'));
    setTimeout(()=>{ location.replace(location.pathname+'?v='+encodeURIComponent(v)); },1200);
  }catch(e){ /* offline o apertura in locale: si prosegue normalmente */ }
}

/* ---------- avvio ---------- */
(function start(){
  checkUpdate();                                // v2.6: controlla se online c'è una versione più nuova
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    $('#screen').innerHTML=`<div class="panel" style="--pg:var(--gold);margin-top:40px">
      <div class="lbl" style="color:var(--gold)">Configurazione</div>
      <p style="font-family:var(--disp);font-size:15px;line-height:1.5">Manca il file <b>config.js</b> nella stessa cartella,
      oppure è vuoto. Deve contenere le tue 2 chiavi Supabase.</p></div>`;
    bootHide();
    return;
  }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  load().catch(err=>{ bootHide(); $('#screen').innerHTML=`<div class="panel" style="--pg:var(--red);margin-top:40px">
    <div class="lbl" style="color:var(--red)">Errore</div>
    <p style="font-family:var(--mono);font-size:12px;line-height:1.5">${esc(err.message||String(err))}</p></div>`; });
})();
</script>
